<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Fur &amp; Fury — Animal Fighting Arena</title>
<style>
  :root{
    --bg:#150f22; --panel:#241c38;
    --gold:#f2c14e; --ember:#f07b3f; --blue:#4a90e2; --red:#e24a4a; --purple:#7a5aa8;
    --text:#f2e3c6; --muted:#9d93b8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;}
  #app{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}

  #select{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;
    padding:16px;overflow-y:auto;}
  h1.title{font-size:clamp(22px,4vw,36px);color:var(--gold);letter-spacing:2px;
    margin:6px 0 2px;text-shadow:0 2px 0 #000;}
  .subtitle{color:var(--muted);font-size:13px;margin-bottom:10px;}
  .sizes{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;justify-content:center;}
  .sizes button{background:var(--panel);color:var(--text);border:2px solid var(--purple);
    border-radius:8px;padding:8px 18px;font-size:14px;cursor:pointer;font-weight:600;}
  .sizes button.active{background:var(--ember);color:#1d1220;border-color:var(--ember);}
  .sizes button:disabled{opacity:.4;cursor:not-allowed;}
  #selectPrompt,#onlinePrompt{margin-bottom:8px;font-size:14px;color:var(--gold);min-height:20px;font-weight:600;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:10px;
    width:min(980px,96vw);}
  .card{background:var(--panel);border:2px solid #3a2f55;border-radius:10px;padding:8px;
    text-align:center;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;
    position:relative;}
  .card:hover{transform:translateY(-4px);border-color:var(--ember);
    box-shadow:0 8px 20px rgba(240,123,63,.25);}
  .card.p1{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset;}
  .card.p2{border-color:var(--red);box-shadow:0 0 0 2px var(--red) inset;}
  .card canvas{width:100%;height:90px;display:block;}
  .card .name{font-weight:700;color:var(--gold);font-size:13px;margin-top:2px;}
  .card .weapon{font-size:10px;color:var(--muted);}
  .card .tag{position:absolute;top:4px;left:4px;font-size:10px;font-weight:700;
    padding:2px 6px;border-radius:4px;}
  .card .tag.p1{background:var(--blue);color:#0b1f38;}
  .card .tag.p2{background:var(--red);color:#380b0b;}
  #fightBtn{margin:16px 0 6px;background:var(--gold);color:#3a2409;border:2px solid var(--gold);
    border-radius:10px;font-size:19px;padding:10px 34px;font-weight:800;cursor:pointer;
    display:none;letter-spacing:1px;}
  #fightBtn:active{transform:scale(.97);}
  #controlsHint,#controlsHintOnline{font-size:11px;color:var(--muted);text-align:center;max-width:600px;
    line-height:1.5;margin-top:6px;}

  #onlinePanel{width:100%;display:flex;flex-direction:column;align-items:center;}
  #onlineActions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0;}
  #onlineActions button{background:var(--panel);color:var(--text);border:2px solid var(--purple);
    border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;font-weight:700;}
  #onlineActions button:hover{border-color:var(--ember);}
  #quickMatchBtn{background:var(--gold);color:#3a2409;border-color:var(--gold);}
  #joinRow{display:flex;gap:6px;}
  #joinCodeInput{background:var(--panel);border:2px solid var(--purple);border-radius:8px;
    color:var(--text);font-size:13px;padding:8px 10px;width:110px;text-transform:uppercase;
    letter-spacing:2px;text-align:center;}
  #onlineLobby{display:none;flex-direction:column;align-items:center;gap:10px;
    background:var(--panel);border:2px solid var(--purple);border-radius:12px;padding:20px 26px;
    margin-top:10px;min-width:280px;}
  #lobbyStatus{color:var(--gold);font-weight:700;font-size:14px;}
  #lobbyCode{font-size:22px;font-weight:900;letter-spacing:4px;color:var(--gold);}
  #lobbyPlayers{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--text);
    min-width:220px;}
  .lobbyRow{background:rgba(0,0,0,.25);border-radius:6px;padding:5px 10px;}

  #game{display:none;width:100%;height:100%;position:relative;
    background:linear-gradient(#2a2140,#150f22);}
  canvas#arena{display:block;margin:0 auto;max-width:100%;max-height:100%;}
  .hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;
    pointer-events:none;}
  .hudSide{display:flex;flex-direction:column;gap:6px;max-width:46%;}
  .hudSide.right{align-items:flex-end;}
  .hudFfa{margin-left:auto;display:flex;flex-direction:column;gap:4px;
    background:rgba(20,15,30,.55);border-radius:10px;padding:8px;max-width:220px;}
  .hpRow{width:min(230px,100%);}
  .hpRow.right{text-align:right;}
  .hpName{font-size:12px;font-weight:700;color:var(--gold);margin-bottom:2px;
    text-shadow:0 1px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hpBarBg{background:#1a1424;border:2px solid #000;border-radius:7px;padding:2px;}
  .hpBarBg canvas{display:block;width:100%;height:16px;}
  #timer{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:26px;
    font-weight:800;color:var(--gold);text-shadow:0 2px 0 #000;}
  #announce{position:absolute;top:36%;left:0;right:0;text-align:center;pointer-events:none;}
  #announceBig{font-size:clamp(28px,6vw,52px);color:var(--gold);text-shadow:0 3px 0 #000;
    font-weight:900;letter-spacing:2px;}
  #announceSub{font-size:16px;color:var(--text);margin-top:4px;text-shadow:0 2px 0 #000;}
  #matchEnd{position:absolute;inset:0;background:rgba(10,7,18,.86);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:8px;}
  #winnerText{font-size:clamp(28px,6vw,46px);color:var(--gold);font-weight:900;}
  #winnerSub{color:var(--muted);font-size:15px;}
  .endBtns{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;justify-content:center;}
  .endBtns button{background:var(--panel);border:2px solid var(--purple);color:var(--text);
    padding:10px 22px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:700;}
  .endBtns button:hover{border-color:var(--ember);}

  #touch{position:absolute;bottom:0;left:0;right:0;display:none;justify-content:space-between;
    padding:10px;pointer-events:none;}
  #touch .pad{pointer-events:auto;display:grid;grid-template-columns:repeat(3,52px);
    grid-template-rows:repeat(2,52px);gap:4px;}
  #touch .atk{pointer-events:auto;display:grid;grid-template-columns:repeat(2,58px);
    gap:8px;align-content:end;}
  #touch button{background:rgba(36,28,56,.85);border:2px solid var(--purple);color:var(--text);
    border-radius:10px;font-size:17px;font-weight:700;touch-action:none;user-select:none;}
  #touch button:active{background:var(--ember);}
  @media (max-width:820px){ #touch{display:flex;} }
</style>
</head>
<body>
<div id="app">
  <div id="select">
    <h1 class="title">FUR &amp; FURY</h1>
    <div class="subtitle">an animal fighting arena</div>
    <div class="sizes" id="topMode">
      <button id="modeLocalBtn" class="active">LOCAL</button>
      <button id="modeOnlineBtn">ONLINE</button>
    </div>

    <div id="localPanel">
      <div class="sizes">
        <button id="mode2p" class="active">2 PLAYERS</button>
        <button id="modeCpu">VS CPU</button>
      </div>
      <div id="selectPrompt">Player 1 — choose your fighter</div>
      <div class="cards" id="cards"></div>
      <button id="fightBtn">FIGHT!</button>
      <div id="controlsHint">P1: A/D move · W jump · S block · F light attack · G heavy attack &nbsp;|&nbsp;
        P2: Arrows move/jump/block · K light · L heavy</div>
    </div>

    <div id="onlinePanel" style="display:none;">
      <div class="sizes" id="onlineModes">
        <button data-mode="1v1" class="active">1 v 1</button>
        <button data-mode="2v2">2 v 2</button>
        <button data-mode="3v3">3 v 3</button>
        <button data-mode="ffa">FREE-FOR-ALL</button>
      </div>
      <div id="onlinePrompt">Choose your fighter</div>
      <div class="cards" id="onlineCards"></div>
      <div id="onlineActions">
        <button id="quickMatchBtn">QUICK MATCH</button>
        <button id="createRoomBtn">CREATE PRIVATE ROOM</button>
        <div id="joinRow">
          <input id="joinCodeInput" maxlength="5" placeholder="CODE">
          <button id="joinRoomBtn">JOIN</button>
        </div>
      </div>
      <div id="onlineLobby">
        <div id="lobbyStatus"></div>
        <div id="lobbyCode"></div>
        <div id="lobbyPlayers"></div>
        <div class="endBtns">
          <button id="readyBtn">READY</button>
          <button id="startRoomBtn" style="display:none;">START MATCH</button>
          <button id="cancelOnlineBtn">CANCEL</button>
        </div>
      </div>
      <div id="controlsHintOnline">Controls: WASD or Arrows to move/jump/block · F or K light attack · G or L heavy attack</div>
    </div>
  </div>

  <div id="game">
    <canvas id="arena" width="960" height="500"></canvas>
    <div class="hud" id="hud"></div>
    <div id="timer">60</div>
    <div id="announce"><div id="announceBig"></div><div id="announceSub"></div></div>
    <div id="matchEnd">
      <div id="winnerText"></div>
      <div id="winnerSub"></div>
      <div class="endBtns">
        <button id="rematchBtn">REMATCH</button>
        <button id="rosterBtn">ROSTER</button>
      </div>
    </div>
    <div id="touch">
      <div class="pad">
        <div></div><button data-key="up">▲</button><div></div>
        <button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button>
      </div>
      <div class="atk">
        <button data-key="light">LT</button><button data-key="heavy">HV</button>
      </div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
"use strict";

/* ============ AUDIO ============ */
let AC=null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(freq,dur,vol,slide){
  const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type='square'; o.frequency.value=freq;
  if(slide) o.frequency.linearRampToValueAtTime(Math.max(30,freq+slide), a.currentTime+dur);
  g.gain.value=vol; g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime+dur);
}
const SFX = {
  hitLight:()=>tone(320,0.08,0.18,-160),
  hitHeavy:()=>tone(160,0.18,0.25,-60),
  block:()=>tone(500,0.06,0.15,80),
  jump:()=>tone(240,0.1,0.12,180),
  ko:()=>tone(140,0.5,0.3,-100),
  select:()=>tone(440,0.05,0.12,120),
  start:()=>tone(300,0.3,0.2,300)
};

/* ============ CHARACTERS ============ */
const CHARS = {};
function addChar(c){ CHARS[c.id]=c; }
const SPECIES_SHAPE = {
  Panther:{ears:'round',tail:'thin'},
  Rat:{ears:'small',tail:'thin'},
  Coyote:{ears:'pointy',tail:'bushy'}
};
const WEAPON_STATS = {
  'War Claws':      {light:{dmg:6, range:46, startup:5, active:5, recover:10, knock:4.0, stun:10}, heavy:{dmg:14,range:54,startup:11,active:6,recover:18,knock:8.5, stun:16}, color:'#f2e3c6'},
  'Katana':         {light:{dmg:7, range:56, startup:6, active:5, recover:11, knock:4.5, stun:11}, heavy:{dmg:16,range:64,startup:13,active:6,recover:20,knock:9.0, stun:18}, color:'#dfeaf0'},
  'Sword & Shield': {light:{dmg:6, range:50, startup:7, active:5, recover:11, knock:4.2, stun:10}, heavy:{dmg:15,range:58,startup:14,active:6,recover:21,knock:9.5, stun:17}, color:'#c9c9d4'},
  'Greataxe':       {light:{dmg:9, range:58, startup:10,active:6, recover:16, knock:6.0, stun:13}, heavy:{dmg:22,range:66,startup:19,active:7,recover:27,knock:12.5,stun:22}, color:'#b5b5c0'},
  'Orb':            {light:{dmg:6, range:62, startup:8, active:6, recover:12, knock:4.0, stun:11}, heavy:{dmg:15,range:74,startup:15,active:7,recover:22,knock:8.0, stun:18}, color:'#8ee3ef'},
  'Spear':          {light:{dmg:7, range:70, startup:8, active:5, recover:12, knock:4.5, stun:11}, heavy:{dmg:16,range:82,startup:15,active:6,recover:22,knock:9.0, stun:18}, color:'#d8c9a0'}
};
function makeAttacks(weapon){
  const w = WEAPON_STATS[weapon];
  return { weapon, light:Object.assign({},w.light), heavy:Object.assign({},w.heavy), weaponColor:w.color };
}

addChar(Object.assign({
  id:'shade', name:'SHADE', species:'Panther', weapon:'War Claws',
  hp:90, speed:4.1, jump:12,
  fur:'#2b2438', furDark:'#1a1624', belly:'#4a4460', eye:'#7bd389',
  blurb:'Silent hunter · deadly claws',
  sprite:{body:'img/shade_body.png', weapon:'img/shade_weapon.png', pivot:[205,222], weaponPivot:[32,32],
    runFrames:{files:['img/shade_run_f0.png','img/shade_run_f1.png','img/shade_run_f2.png','img/shade_run_f3.png','img/shade_run_f4.png','img/shade_run_f5.png','img/shade_run_f6.png','img/shade_run_f7.png','img/shade_run_f8.png','img/shade_run_f9.png','img/shade_run_f10.png','img/shade_run_f11.png','img/shade_run_f12.png','img/shade_run_f13.png','img/shade_run_f14.png','img/shade_run_f15.png','img/shade_run_f16.png','img/shade_run_f17.png','img/shade_run_f18.png','img/shade_run_f19.png'], groundYs:[465,472,477,481,484,484,484,481,477,472,465,464,463,462,462,462,462,462,463,464], w:458, h:491},
    stand:{file:'img/shade_stand.png', groundY:597, w:346, h:600}}
}, makeAttacks('War Claws')));

addChar(Object.assign({
  id:'gnash', name:'GNASH', species:'Rat', weapon:'Katana',
  hp:80, speed:4.5, jump:11,
  fur:'#8a7a5c', furDark:'#5c4f38', belly:'#c7b98f', eye:'#ff2e2e',
  blurb:'Scarred and vicious · never backs down',
  sprite:{body:'img/gnash_body.png', weapon:'img/gnash_weapon.png', pivot:[68,128], weaponPivot:[32,32],
    runFrames:{files:['img/gnash_run_f0.png','img/gnash_run_f1.png','img/gnash_run_f2.png','img/gnash_run_f3.png','img/gnash_run_f4.png','img/gnash_run_f5.png','img/gnash_run_f6.png','img/gnash_run_f7.png','img/gnash_run_f8.png','img/gnash_run_f9.png','img/gnash_run_f10.png','img/gnash_run_f11.png','img/gnash_run_f12.png','img/gnash_run_f13.png','img/gnash_run_f14.png','img/gnash_run_f15.png','img/gnash_run_f16.png','img/gnash_run_f17.png','img/gnash_run_f18.png','img/gnash_run_f19.png'], groundYs:[391,406,419,428,433,434,433,428,419,406,391,383,374,367,364,363,364,367,374,383], w:518, h:443},
    stand:{file:'img/gnash_stand.png', groundY:597, w:374, h:600}}
}, makeAttacks('Katana')));

addChar(Object.assign({
  id:'howler', name:'HOWLER', species:'Coyote', weapon:'Sword & Shield',
  hp:100, speed:3.6, jump:11,
  fur:'#b9863f', furDark:'#7d5c2a', belly:'#e6d3a0', eye:'#ffa726',
  blurb:'Moonlit raider · unbreakable guard',
  sprite:{body:'img/howler_body.png', weapon:'img/howler_weapon.png', pivot:[112,158], weaponPivot:[104,87],
    runFrames:{files:['img/howler_run_f0.png','img/howler_run_f1.png','img/howler_run_f2.png','img/howler_run_f3.png','img/howler_run_f4.png','img/howler_run_f5.png','img/howler_run_f6.png','img/howler_run_f7.png','img/howler_run_f8.png','img/howler_run_f9.png','img/howler_run_f10.png','img/howler_run_f11.png','img/howler_run_f12.png','img/howler_run_f13.png','img/howler_run_f14.png','img/howler_run_f15.png','img/howler_run_f16.png','img/howler_run_f17.png','img/howler_run_f18.png','img/howler_run_f19.png'], groundYs:[450,466,478,486,490,492,490,486,478,466,450,446,441,441,442,442,442,441,441,446], w:460, h:498},
    stand:{file:'img/howler_stand.png', groundY:597, w:381, h:600}}
}, makeAttacks('Sword & Shield')));

function allIds(){ return Object.keys(CHARS); }

const spriteImages = {};
for(const id of allIds()){
  const c = CHARS[id];
  if(c.sprite){
    const body = new Image();
    const weapon = new Image();
    const onAnyLoad = ()=>{ renderCards(); renderOnlineCards(); };
    body.onload = onAnyLoad; body.src = c.sprite.body;
    weapon.onload = onAnyLoad; weapon.src = c.sprite.weapon;
    const entry = { body, weapon };
    if(c.sprite.runFrames){
      entry.runFrames = c.sprite.runFrames.files.map(src=>{
        const im = new Image();
        im.onload = onAnyLoad; im.src = src;
        return im;
      });
    }
    if(c.sprite.stand){
      const stand = new Image();
      stand.onload = onAnyLoad; stand.src = c.sprite.stand.file;
      entry.stand = stand;
    }
    spriteImages[id] = entry;
  }
}
function hasSprite(char){
  const s = spriteImages[char.id];
  return !!(char.sprite && s && s.body.complete && s.body.naturalWidth>0
            && s.weapon.complete && s.weapon.naturalWidth>0);
}
function hasStandSprite(char){
  const s = spriteImages[char.id];
  return !!(s && s.stand && s.stand.complete && s.stand.naturalWidth>0);
}
function runFrameIndex(char, animT){
  const rf = char.sprite && char.sprite.runFrames;
  if(!rf) return 0;
  const N = rf.files.length;
  const framesPerPose = 3;
  return Math.floor((animT||0)/framesPerPose) % N;
}
function hasRunSprite(char){
  const s = spriteImages[char.id];
  return !!(s && s.runFrames && s.runFrames.every(im=>im.complete && im.naturalWidth>0));
}

/* ============ RENDERING HELPERS ============ */
const OUTLINE = '#150f22';
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function drawLimb(c, x1,y1,x2,y2, bend, width, color){
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  const dx=x2-x1, dy=y2-y1;
  const len=Math.hypot(dx,dy)||1;
  const px=-dy/len, py=dx/len;
  const kx=mx+px*bend, ky=my+py*bend;
  c.lineCap='round'; c.lineJoin='round';
  c.strokeStyle=OUTLINE; c.lineWidth=width+3;
  c.beginPath(); c.moveTo(x1,y1); c.lineTo(kx,ky); c.lineTo(x2,y2); c.stroke();
  c.strokeStyle=color; c.lineWidth=width;
  c.beginPath(); c.moveTo(x1,y1); c.lineTo(kx,ky); c.lineTo(x2,y2); c.stroke();
  return {kx,ky};
}
function drawTail(ctx,x,y,type,color,walk){
  const sway=Math.sin(walk)*6;
  ctx.lineCap='round';
  if(type==='bushy'){
    ctx.lineWidth=13; ctx.strokeStyle=OUTLINE;
    ctx.beginPath(); ctx.moveTo(x,y-4); ctx.quadraticCurveTo(x-22,y-10+sway,x-30,y-26); ctx.stroke();
    ctx.lineWidth=10; ctx.strokeStyle=color;
    ctx.beginPath(); ctx.moveTo(x,y-4); ctx.quadraticCurveTo(x-22,y-10+sway,x-30,y-26); ctx.stroke();
  } else if(type==='puff'){
    ctx.lineWidth=9; ctx.strokeStyle=OUTLINE;
    ctx.beginPath(); ctx.moveTo(x,y-4); ctx.quadraticCurveTo(x-16,y-8+sway,x-20,y-20); ctx.stroke();
    ctx.lineWidth=6; ctx.strokeStyle=color;
    ctx.beginPath(); ctx.moveTo(x,y-4); ctx.quadraticCurveTo(x-16,y-8+sway,x-20,y-20); ctx.stroke();
    ctx.fillStyle=OUTLINE; ctx.beginPath(); ctx.arc(x-20,y-20,7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x-20,y-20,5,0,Math.PI*2); ctx.fill();
  } else if(type==='stub'){
    ctx.lineWidth=8; ctx.strokeStyle=OUTLINE;
    ctx.beginPath(); ctx.moveTo(x,y-4); ctx.lineTo(x-8,y-6); ctx.stroke();
    ctx.lineWidth=5; ctx.strokeStyle=color;
    ctx.beginPath(); ctx.moveTo(x,y-4); ctx.lineTo(x-8,y-6); ctx.stroke();
  } else {
    ctx.lineWidth=6; ctx.strokeStyle=OUTLINE;
    ctx.beginPath(); ctx.moveTo(x,y-4); ctx.quadraticCurveTo(x-20,y-14+sway,x-26,y-30); ctx.stroke();
    ctx.lineWidth=3.5; ctx.strokeStyle=color;

}
function drawEars(ctx,cx,cy,type,fur){

    ctx.fillStyle=fur; ctx.beginPath(); ctx.arc(cx-8,cy-11,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=OUTLINE; ctx.beginPath(); ctx.arc(cx+7,cy-12,5.5,0,Math.PI*2); ctx.fill();

function drawSpriteBody(ctx, char, anim){
  const s = spriteImages[char.id];
  const bodyImg = s.body, weaponImg = s.weapon;
  const animT = anim.animT||0;
  const H = 125, W = H*(bodyImg.naturalWidth/bodyImg.naturalHeight);
  const scale = H/bodyImg.naturalHeight;

  let bob=0, sway=0, lean=0, lunge=0, squishX=1, squishY=1, alpha=1, koRot=0, swingAngle=0;
  const atk = anim.attack;

  if(anim.state==='idle'){
    bob = Math.sin(animT*0.05)*2;
    sway = Math.sin(animT*0.04+1)*1.2;
    lean = Math.sin(animT*0.05)*0.015;
    squishY = 1 + Math.sin(animT*0.05)*0.01;
    swingAngle = Math.sin(animT*0.06)*0.06;
  } else if(anim.state==='walk'){
    bob = Math.abs(Math.sin(animT*0.3))*7;
    sway = Math.sin(animT*0.3)*4;
    lean = Math.sin(animT*0.3)*0.07;
    squishY = 1 - Math.abs(Math.sin(animT*0.3))*0.04;
    swingAngle = Math.sin(animT*0.3+0.6)*0.16;
  } else if(anim.state==='jump'){
    const vy = anim.vy||0;
    bob = -Math.min(1, Math.abs(vy)/14) * 10;
    if(vy>0){ squishY=1.08; squishX=0.94; } else { squishY=0.94; squishX=1.05; }
    swingAngle = -Math.max(-0.2, Math.min(0.2, vy*0.015));
  } else if(anim.state==='attack' && atk){
    if(anim.phase==='startup'){
      const p = anim.phaseT/Math.max(1,atk.startup);
      bob = p*3; lunge = -p*4; lean = -p*0.08;
      swingAngle = -1.0*p;
    } else if(anim.phase==='active'){
      const p = anim.phaseT/Math.max(1,atk.active);
      lunge = -4 + p*20; lean = -0.08 + p*0.28;
      swingAngle = -1.0 + 2.3*p;
    } else {
      const p = anim.phaseT/Math.max(1,atk.recover);
      lunge = 16*(1-p); lean = 0.2*(1-p);
      swingAngle = 1.3*(1-p);
    }
  } else if(anim.state==='hitstun'){
    lunge = -10; lean = -0.12 + Math.sin(animT*0.8)*0.03;
    swingAngle = 0.5 + Math.sin(animT*0.8)*0.1;
  } else if(anim.state==='block'){
    squishY = 0.92; lunge = -4; swingAngle = -0.35;
  } else if(anim.state==='ko'){
    koRot = Math.PI/2*0.85 + Math.sin(animT*0.1)*0.02;
    alpha = 0.9; swingAngle = 1.2;
  }

  ctx.translate(lunge+sway, bob);
  ctx.rotate(lean + koRot);
  ctx.scale(squishX, squishY);
  ctx.globalAlpha = alpha;
  if(anim.hitFlash>0) ctx.filter = 'brightness(1.6) saturate(1.3)';

  ctx.drawImage(bodyImg, -W/2, -H, W, H);

  const pivotX = -W/2 + char.sprite.pivot[0]*scale;
  const pivotY = -H + char.sprite.pivot[1]*scale;
  const wp = char.sprite.weaponPivot;
  ctx.save();
  ctx.translate(pivotX, pivotY);
  ctx.rotate(swingAngle);
  ctx.drawImage(weaponImg, -wp[0]*scale, -wp[1]*scale, weaponImg.naturalWidth*scale, weaponImg.naturalHeight*scale);
  ctx.restore();

  ctx.filter = 'none';
  ctx.globalAlpha = 1;
}
function drawRunSprite(ctx, char, anim){
  const frames = spriteImages[char.id].runFrames;
  const rf = char.sprite.runFrames;
  const animT = anim.animT||0;
  const idx = runFrameIndex(char, animT);
  const img = frames[idx];
  const H = 125, W = H*(rf.w/rf.h);
  const groundYRatio = rf.groundYs[idx]/rf.h;

  if(anim.hitFlash>0) ctx.filter = 'brightness(1.6) saturate(1.3)';
  ctx.drawImage(img, -W/2, -groundYRatio*H, W, H);

}
function drawStandSprite(ctx, char, anim){
  const img = spriteImages[char.id].stand;
  const st = char.sprite.stand;
  const animT = anim.animT||0;
  const H = 125, W = H*(st.w/st.h);
  const groundYRatio = st.groundY/st.h;

  const bob = Math.sin(animT*0.05)*1.5;
  const sway = Math.sin(animT*0.04+1)*0.02;

  ctx.translate(0, bob);
  ctx.rotate(sway);
  if(anim.hitFlash>0) ctx.filter = 'brightness(1.6) saturate(1.3)';
  ctx.drawImage(img, -W/2, -groundYRatio*H, W, H);
  ctx.filter = 'none';
}
function renderFighterSprite(ctx, char, ox, oy, facing, anim){
  ctx.save();
  ctx.translate(ox, oy);
  if(facing<0) ctx.scale(-1,1);
  if(anim.state==='walk' && hasRunSprite(char)){
    drawRunSprite(ctx, char, anim);
    ctx.restore();
    return;
  }
  if(anim.state==='idle' && hasStandSprite(char)){
    drawStandSprite(ctx, char, anim);
    ctx.restore();
    return;
  }
  if(hasSprite(char)){
    drawSpriteBody(ctx, char, anim);
    ctx.restore();
    return;
  }
  const shape = SPECIES_SHAPE[char.species] || {ears:'round',tail:'thin'};

  const animT = anim.animT||0;
  const walk = anim.state==='walk' ? animT*0.35 : 0;
  const bob = anim.state==='idle' ? Math.sin(animT*0.08)*2 : 0;
  const crouch = anim.state==='block' ? 6 : 0;
  const airT = anim.state==='jump' ? Math.min(1, Math.abs(anim.vy||0)/14) : 0;

  let armSwing = 0;
  if(anim.state==='attack' && anim.attack){
    if(anim.phase==='startup') armSwing = anim.phaseT/Math.max(1,anim.attack.startup);
    else if(anim.phase==='active') armSwing = 1;
    else armSwing = Math.max(0, 1-(anim.phaseT/Math.max(1,anim.attack.recover)));
  }
  if(anim.state==='hitstun') armSwing = -0.3;

  const hipY = -42+crouch-airT*4;
  const shY = -74+crouch*0.6-bob;
  const headCX = 4, headCY = shY-16;
  const headR = 13;
  const legTuck = airT*14;

  drawTail(ctx, -6, hipY, shape.tail, char.furDark, walk);
  drawLimb(ctx, -6, hipY, -6+Math.sin(walk+Math.PI)*10, -legTuck, 8, 9, char.furDark);
  drawLimb(ctx, -4, shY, -4+(-8+armSwing*10), shY+30, -6, 7, char.furDark);

  ctx.fillStyle=OUTLINE; roundRect(ctx,-13,shY-2,26,hipY-shY+4,10); ctx.fill();
  ctx.fillStyle=char.fur; roundRect(ctx,-11,shY,22,hipY-shY,9); ctx.fill();
  ctx.fillStyle=char.belly; roundRect(ctx,-6,shY+8,12,Math.max(2,hipY-shY-10),6); ctx.fill();

  drawLimb(ctx, 6, hipY, 6+Math.sin(walk)*10, -legTuck, -8, 9, char.fur);

  ctx.fillStyle=OUTLINE; ctx.beginPath(); ctx.arc(headCX,headCY,headR+2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=char.fur; ctx.beginPath(); ctx.arc(headCX,headCY,headR,0,Math.PI*2); ctx.fill();
  drawEars(ctx, headCX, headCY, shape.ears, char.fur);
  if(shape.tusks){
    ctx.fillStyle='#f4f0e6';
    ctx.beginPath(); ctx.moveTo(headCX+6,headCY+6); ctx.lineTo(headCX+12,headCY+9); ctx.lineTo(headCX+7,headCY+11); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle=char.eye; ctx.beginPath(); ctx.arc(headCX+7,headCY-1,2.6,0,Math.PI*2); ctx.fill();

  const handX = 10+armSwing*22, handY = shY+22-armSwing*14;
  drawLimb(ctx, 6, shY, handX, handY, 8, 7, char.fur);
  drawWeapon(ctx, char.weapon, handX, handY, armSwing);

  if(anim.hitFlash>0){
    ctx.globalAlpha = Math.min(0.6, anim.hitFlash/6);
    ctx.fillStyle='#fff';
    roundRect(ctx,-16,shY-6,32,hipY-shY+14,12); ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

/* ============ GAME STATE ============ */
const ARENA_W=960, ARENA_H=500, GROUND_Y=400, GRAVITY=0.7, MIN_SEP=34, WORLD_W=1500;
const PLATFORM_LEFT=150, PLATFORM_RIGHT=WORLD_W-150, FALL_DEATH_Y=-260;
let vsCpu=false, selectedP1=null, selectedP2=null;
let fighters=[], phase='select', timer=60, frameCount=0, shake=0, announceTO=null;
let particles=[];

const arenaBgImg = new Image();
arenaBgImg.src = 'img/arena-plains.webp';

/* ---- online state ---- */
let socket=null, netAvailable=false;
let onlineMode='1v1', onlineSelectedChar=null, currentRoomCode=null, amReady=false;
let onlinePlaying=false, iAmHost=false, netMatchId=null;
const remoteInputBuffer = new Map();
let snapPrev=null, snapNext=null;
const hpCanvasById = new Map();

try{
  if(typeof io === 'function'){ socket = io(); netAvailable = true; }
}catch(e){ netAvailable=false; }

function makeFighter(char, team, id){
  return {
    char, team, id,
    x:0, y:0, vy:0, vx:0, facing:1,
    hp:char.hp, maxHp:char.hp,
    state:'idle', phase:'', phaseT:0, animT:0,
    attackKey:null, attack:null, hitThisSwing:false,
    stateT:0, cooldown:0, onGround:true, hitFlash:0,
    prevLight:false, prevHeavy:false,
    input:{left:false,right:false,up:false,down:false,light:false,heavy:false}
  };
}
function assignSpawns(fList){
  const teamIds=[...new Set(fList.map(f=>f.team))].sort((a,b)=>a-b);
  if(teamIds.length<=2){
    placeSide(fList.filter(f=>f.team===teamIds[0]), WORLD_W*0.28, 1);
    if(teamIds[1]!==undefined) placeSide(fList.filter(f=>f.team===teamIds[1]), WORLD_W*0.72, -1);
  } else {
    const n=fList.length;
    fList.forEach((f,i)=>{ f.x = 220 + (WORLD_W-440) * (n<=1?0.5:i/(n-1)); f.facing=1; });
  }
  function placeSide(members, centerX, faceDir){
    const spread=90;
    const startX = centerX - spread*(members.length-1)/2;
    members.forEach((f,i)=>{ f.x = startX + i*spread; f.facing=faceDir; f.y=0; f.vy=0; f.vx=0; });
  }
}

function spawnHit(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=1+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*s, vy:Math.sin(a)*s-1, life:16+Math.random()*10, color});
  }
}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life--;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(c){
  for(const p of particles){
    c.globalAlpha=Math.max(0,p.life/24);
    c.fillStyle=p.color;
    c.fillRect(p.x-2,p.y-2,4,4);
  }
  c.globalAlpha=1;
}

function findNearestEnemy(f, fList){
  let best=null, bestD=Infinity;
  for(const o of fList){
    if(o===f || o.team===f.team) continue;
    if(o.hp<=0 || o.state==='ko') continue;
    const d=Math.abs(o.x-f.x);
    if(d<bestD){ bestD=d; best=o; }
  }
  return best;
}

function applyHit(atk,def){
  const a = atk.attack;
  const dir = atk.facing;
  const hurtY = GROUND_Y-def.y-50;
  if(def.state==='block'){
    const chip = Math.ceil(a.dmg*0.15);
    def.hp = Math.max(0, def.hp-chip);
    def.vx = dir*a.knock*0.3;
    SFX.block();
    spawnHit(def.x, hurtY, '#8ee3ef', 6);
    shake = Math.max(shake,3);
  } else {
    def.hp = Math.max(0, def.hp-a.dmg);
    def.vx = dir*a.knock;
    def.vy = Math.max(def.vy, a.knock*0.35);
    def.onGround=false;
    def.state='hitstun'; def.stateT=a.stun;
    def.hitFlash=6;
    SFX[atk.attackKey==='heavy'?'hitHeavy':'hitLight']();
    spawnHit(def.x, hurtY, '#ff6b6b', a.dmg>10?14:8);
    shake = Math.max(shake, a.dmg>10?7:3);
    if(def.hp<=0){ def.state='ko'; def.hitFlash=10; }
  }
}

function computeCpuInput(cpu, target){
  const input = cpu.input;
  input.left=input.right=input.up=input.down=input.light=input.heavy=false;
  if(!target || cpu.state==='ko' || cpu.state==='hitstun') return;
  const dx = target.x - cpu.x;
  const dist = Math.abs(dx);
  if(Math.random()<0.004 && dist<90){ input.down=true; return; }
  if(dist>70){
    if(dx>0) input.right=true; else input.left=true;
    if(Math.random()<0.01 && cpu.onGround) input.up=true;
  } else if(dist<38){
    if(Math.random()<0.5){ if(dx>0) input.left=true; else input.right=true; }
  }
  const heavyRange = WEAPON_STATS[cpu.char.weapon].heavy.range;
  if(dist<heavyRange && cpu.cooldown<=0 && cpu.state!=='attack'){
    if(Math.random()<0.045) input.heavy=true;
    else if(Math.random()<0.09) input.light=true;
  }
  if(cpu.hp < cpu.maxHp*0.25 && Math.random()<0.02 && cpu.onGround) input.up=true;
}

function updateFighter(f, fList){
  f.animT++;
  const target = findNearestEnemy(f, fList);
  if(f.state!=='attack' && f.state!=='hitstun' && f.state!=='ko'){
    if(!f.input.down && f.input.left) f.facing = -1;
    else if(!f.input.down && f.input.right) f.facing = 1;
    else if(target) f.facing = (target.x>=f.x) ? 1 : -1;
  }
  const lightEdge = f.input.light && !f.prevLight;
  const heavyEdge = f.input.heavy && !f.prevHeavy;
  f.prevLight = f.input.light; f.prevHeavy = f.input.heavy;

  const spd = f.char.speed*1.6;
  switch(f.state){
    case 'idle':
    case 'walk':
      f.vx=0;
      if(f.input.left){ f.vx=-spd; f.state='walk'; }
      else if(f.input.right){ f.vx=spd; f.state='walk'; }
      else f.state='idle';
      if(f.input.up && f.onGround){
        f.vy = Math.sqrt(2*GRAVITY*(f.char.jump*12));
        f.onGround=false; f.state='jump'; SFX.jump();
      } else if(f.input.down){
        f.state='block'; f.vx=0;
      } else if(f.cooldown<=0 && (lightEdge||heavyEdge)){
        f.attackKey = heavyEdge?'heavy':'light';
        f.attack = f.char[f.attackKey];
        f.state='attack'; f.phase='startup'; f.phaseT=0; f.hitThisSwing=false;
      }
      break;
    case 'block':
      f.vx=0;
      if(!f.input.down) f.state='idle';
      break;
    case 'jump':
      if(f.input.left) f.vx=-spd*0.8;
      else if(f.input.right) f.vx=spd*0.8;
      else f.vx*=0.9;
      break;
    case 'attack':
      f.vx *= 0.8;
      f.phaseT++;
      if(f.phase==='startup' && f.phaseT>=f.attack.startup){ f.phase='active'; f.phaseT=0; }
      else if(f.phase==='active'){
        if(!f.hitThisSwing && target){
          const dist = Math.abs(target.x-f.x);
          const facingCorrect = (target.x-f.x)*f.facing>=0;
          if(dist<=f.attack.range && facingCorrect){
            applyHit(f,target);
            f.hitThisSwing=true;
          }
        }
        if(f.phaseT>=f.attack.active){ f.phase='recover'; f.phaseT=0; }
      } else if(f.phase==='recover'){
        if(f.phaseT>=f.attack.recover){ f.state='idle'; f.cooldown=6; }
      }
      break;
    case 'hitstun':
      f.stateT--;
      f.vx*=0.9;
      if(f.stateT<=0) f.state='idle';
      break;
    case 'ko':
      f.vx*=0.9;
      break;
  }

  f.x += f.vx;
  f.x = Math.max(40, Math.min(WORLD_W-40, f.x));

  f.y += f.vy;
  f.vy -= GRAVITY;
  const onPlatform = f.x>=PLATFORM_LEFT && f.x<=PLATFORM_RIGHT;
  if(f.y<=0 && onPlatform){
    f.y=0; f.vy=0;
    if(!f.onGround){
      f.onGround=true;
      if(f.state==='jump') f.state=(f.input.left||f.input.right)?'walk':'idle';
    }
  } else {
    if(f.onGround && (f.state==='idle'||f.state==='walk')) f.state='jump';
    f.onGround=false;
  }

  if(f.state!=='ko' && f.y<FALL_DEATH_Y){
    f.hp=0; f.state='ko'; f.hitFlash=10;
    spawnHit(f.x, GROUND_Y-f.y, '#ff6b6b', 16);
    SFX.ko();
  }

  if(f.state==='walk' && f.onGround && hasRunSprite(f.char)){
    const runIdx = runFrameIndex(f.char, f.animT);
    if(runIdx===5 && f.lastRunIdx!==5) spawnHit(f.x, GROUND_Y-1, '#9c8f74', 4);
    f.lastRunIdx = runIdx;
  }

  if(f.cooldown>0) f.cooldown--;
  if(f.hitFlash>0) f.hitFlash--;
}

function stepPhysics(){
  for(const f of fighters) updateFighter(f, fighters);
  for(let i=0;i<fighters.length;i++){
    for(let j=i+1;j<fighters.length;j++){
      const a=fighters[i], b=fighters[j];
      if(a.state==='hitstun'||b.state==='hitstun'||a.state==='ko'||b.state==='ko') continue;
      const d = Math.abs(a.x-b.x);
      if(d<MIN_SEP){
        const push=(MIN_SEP-d)/2;
        if(a.x<b.x){ a.x-=push; b.x+=push; } else { a.x+=push; b.x-=push; }
      }
    }
  }
  for(const f of fighters) f.x = Math.max(40, Math.min(WORLD_W-40, f.x));
  updateParticles();
  shake = Math.max(0, shake-0.8);
}

/* ============ CAMERA + ARENA RENDERING ============ */
const arenaCanvas = document.getElementById('arena');
const actx = arenaCanvas.getContext('2d');
function computeCamera(){
  const alive = fighters.filter(f=>f.state!=='ko');
  const list = alive.length? alive : fighters;
  let minX=Infinity, maxX=-Infinity;
  for(const f of list){ minX=Math.min(minX,f.x); maxX=Math.max(maxX,f.x); }
  if(!isFinite(minX)){ minX=0; maxX=WORLD_W; }
  minX -= 170; maxX += 170;
  const width = Math.max(420, maxX-minX);
  let scale = Math.min(1, ARENA_W/width);
  scale = Math.max(0.5, scale);
  return { scale, centerX:(minX+maxX)/2 };
}
function drawArena(){
  const cam = computeCamera();
  actx.save();
  actx.clearRect(0,0,ARENA_W,ARENA_H);
  if(arenaBgImg.complete && arenaBgImg.naturalWidth>0){
    const iw=arenaBgImg.naturalWidth, ih=arenaBgImg.naturalHeight;
    const s = Math.max(ARENA_W/iw, ARENA_H/ih);
    const dw=iw*s, dh=ih*s;
    actx.drawImage(arenaBgImg, (ARENA_W-dw)/2, (ARENA_H-dh)/2, dw, dh);
  } else {
    const grd = actx.createLinearGradient(0,0,0,ARENA_H);
    grd.addColorStop(0,'#2a2140'); grd.addColorStop(1,'#150f22');
    actx.fillStyle=grd; actx.fillRect(0,0,ARENA_W,ARENA_H);
  }

  actx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  actx.translate(ARENA_W/2, 0);
  actx.scale(cam.scale, cam.scale);
  actx.translate(-cam.centerX, 0);

  actx.fillStyle='rgba(10,8,18,0.5)';
  actx.fillRect(PLATFORM_LEFT,GROUND_Y,PLATFORM_RIGHT-PLATFORM_LEFT,ARENA_H-GROUND_Y+400);
  actx.strokeStyle='rgba(242,193,78,.6)'; actx.lineWidth=3/cam.scale;
  actx.beginPath(); actx.moveTo(PLATFORM_LEFT,GROUND_Y); actx.lineTo(PLATFORM_RIGHT,GROUND_Y); actx.stroke();

  const order = fighters.slice().sort((a,b)=>a.x-b.x);
  for(const f of order){
    renderFighterSprite(actx, f.char, f.x, GROUND_Y-f.y, f.facing, f);
  }
  drawParticles(actx);
  actx.restore();
}
function drawHpBar(canvas, hp, maxHp){
  const c = canvas.getContext('2d');
  c.clearRect(0,0,canvas.width,canvas.height);
  c.fillStyle='#000'; roundRect(c,0,0,canvas.width,canvas.height,6); c.fill();
  const pct = Math.max(0,hp/maxHp);
  const w = (canvas.width-6)*pct;
  c.fillStyle = pct>0.5?'#7bd389':pct>0.2?'#ffd166':'#f0533f';
  if(w>0){ roundRect(c,3,3,w,canvas.height-6,4); c.fill(); }
}

function showAnnounce(big,sub){
  document.getElementById('announceBig').textContent=big;
  document.getElementById('announceSub').textContent=sub||'';
  clearTimeout(announceTO);
  announceTO=setTimeout(()=>{
    document.getElementById('announceBig').textContent='';
    document.getElementById('announceSub').textContent='';
  }, 1400);
}
function describeTeamWin(team){
  const members = fighters.filter(f=>f.team===team);
  if(members.length===1) return { title: members[0].char.name+' WINS!', sub: members[0].char.blurb };
  return { title: members.map(f=>f.char.name).join(' & ')+' WIN!', sub: 'Teamwork triumphs.' };
}

  document.getElementById('matchEnd').style.display='flex';
  document.getElementById('winnerText').textContent = info.title;
  document.getElementById('winnerSub').textContent = info.sub;
  document.getElementById('rematchBtn').style.display = (onlinePlaying && !iAmHost) ? 'none' : 'inline-block';
}
function presentMatchEnd(reason, info){
  showAnnounce(reason==='time'?'TIME UP!':'K.O.!','');
  SFX.ko();
  setTimeout(()=>{ showMatchEndInfo(info); }, 1200);
}
function concludeMatch(winningTeam, reason){
  if(phase!=='fight') return;
  const info = (winningTeam===null||winningTeam===undefined)
    ? {title:'DRAW!', sub:'Both sides standing... barely.'}
    : describeTeamWin(winningTeam);
  if(onlinePlaying){
    if(iAmHost){
      phase='ending';
      socket.emit('matchEvent', {type:'end', reason, info});
    }
  } else {
    phase='end';
    presentMatchEnd(reason, info);
  }
}
function checkMatchEnd(){
  if(phase!=='fight') return;
  const teamIds=[...new Set(fighters.map(f=>f.team))];
  const aliveTeams = teamIds.filter(t=> fighters.some(f=>f.team===t && f.state!=='ko' && f.hp>0));
  if(aliveTeams.length<=1){
    concludeMatch(aliveTeams.length===1?aliveTeams[0]:null, 'ko');
  }
}
function endByTime(){
  if(phase!=='fight') return;
  const teamIds=[...new Set(fighters.map(f=>f.team))];
  let best=null, bestHp=-1, tie=false;
  for(const t of teamIds){
    const hp = fighters.filter(f=>f.team===t).reduce((s,f)=>s+Math.max(0,f.hp),0);
    if(hp>bestHp){ bestHp=hp; best=t; tie=false; } else if(hp===bestHp){ tie=true; }
  }
  concludeMatch(tie?null:best, 'time');
}

    beginNetworkedMatch(players);

  socket.on('peerInput', ({playerId,input})=>{ remoteInputBuffer.set(playerId, input); });
  socket.on('stateSync', (payload)=>{

    snapPrev = snapNext || {time: performance.now()-100, dataById};
    snapNext = {time: performance.now(), dataById};

const keys = {};
window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  keys[k]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });

const touchState={left:false,right:false,up:false,down:false,light:false,heavy:false};
document.querySelectorAll('#touch button').forEach(b=>{
  const key=b.dataset.key;
  const on=e=>{ e.preventDefault(); touchState[key]=true; };
  const off=e=>{ e.preventDefault(); touchState[key]=false; };
  b.addEventListener('pointerdown',on);
  b.addEventListener('pointerup',off);
  b.addEventListener('pointerleave',off);
  b.addEventListener('pointercancel',off);
});

function stepLocalInput(){
  const p1 = fighters[0], p2 = fighters[1];
  p1.input.left = !!keys['a'] || touchState.left;
  p1.input.right = !!keys['d'] || touchState.right;
  p1.input.up = !!keys['w'] || touchState.up;
  p1.input.down = !!keys['s'] || touchState.down;
  p1.input.light = !!keys['f'] || touchState.light;
  p1.input.heavy = !!keys['g'] || touchState.heavy;

  if(vsCpu){
    computeCpuInput(p2, p1);
  } else {
    p2.input.left = !!keys['arrowleft'];
    p2.input.right = !!keys['arrowright'];
    p2.input.up = !!keys['arrowup'];
    p2.input.down = !!keys['arrowdown'];
    p2.input.light = !!keys['k'];
    p2.input.heavy = !!keys['l'];
  }
}
function captureUnifiedInput(){
  return {
    left: !!keys['a']||!!keys['arrowleft']||touchState.left,
    right: !!keys['d']||!!keys['arrowright']||touchState.right,
    up: !!keys['w']||!!keys['arrowup']||touchState.up,
    down: !!keys['s']||!!keys['arrowdown']||touchState.down,
    light: !!keys['f']||!!keys['k']||touchState.light,
    heavy: !!keys['g']||!!keys['l']||touchState.heavy
  };
}
function assembleHostInputs(){
  const my = captureUnifiedInput();
  for(const f of fighters){
    if(f.id===socket.id) f.input = my;
    else f.input = remoteInputBuffer.get(f.id) || {left:false,right:false,up:false,down:false,light:false,heavy:false};
  }
}
function sendLocalInputIfPeer(){
  if(!onlinePlaying || iAmHost || !socket) return;
  socket.emit('input', captureUnifiedInput());
}
function interpolateRemoteFighters(){
  if(!snapPrev || !snapNext) return;
  const now = performance.now();
  const span = Math.max(1, snapNext.time - snapPrev.time);
  const t = Math.max(0, Math.min(1, (now - snapPrev.time)/span));
  for(const f of fighters){
    const a = snapPrev.dataById.get(f.id);
    const b = snapNext.dataById.get(f.id);
    if(!a || !b) continue;
    f.x = a.x + (b.x-a.x)*t;
    f.y = a.y + (b.y-a.y)*t;
    f.facing = b.facing;
    f.hp = b.hp; f.state = b.state; f.phase = b.phase; f.phaseT = b.phaseT;
    f.attackKey = b.attackKey; f.attack = b.attackKey ? f.char[b.attackKey] : null;
    f.animT = b.animT; f.hitFlash = b.hitFlash; f.vy = b.vy;
  }
}
function sendHostSnapshot(){
  if(!onlinePlaying || !iAmHost || !socket) return;
  socket.emit('stateSync', {
    timer,
    fighters: fighters.map(f=>({
      id:f.id, x:f.x, y:f.y, vy:f.vy, facing:f.facing, hp:f.hp,
      state:f.state, phase:f.phase, phaseT:f.phaseT, attackKey:f.attackKey,
      animT:f.animT, hitFlash:f.hitFlash
    }))
  });
}

/* ============ MAIN LOOP ============ */
function loop(){
  requestAnimationFrame(loop);
  if(phase==='fight'){
    const simDriver = !onlinePlaying || iAmHost;
    if(simDriver){
      if(onlinePlaying) assembleHostInputs(); else stepLocalInput();
      stepPhysics();
      frameCount++;
      if(frameCount%60===0 && timer>0){
        timer--; updateTimerDisplay();
        if(timer<=0){ endByTime(); }
      }
      if(onlinePlaying && frameCount%3===0) sendHostSnapshot();
      checkMatchEnd();
    } else {
      sendLocalInputIfPeer();
      interpolateRemoteFighters();
    }
    drawArena();
    updateHudBars();
  } else if(phase==='end' || phase==='ending'){
    drawArena();
  }
}

renderCards(); updatePrompt(); updateFightBtn();
requestAnimationFrame(loop);
})();
</script>
